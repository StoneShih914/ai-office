<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stone 的 AI 夜城辦公室 · NEON OFFICE v2</title>
<style>
:root{--glass:rgba(18,20,30,.42);--line:rgba(255,255,255,.14);--cy:#4ff3ff;--mg:#ff3fb4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05060c;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#e9ecf2}
#app{position:fixed;inset:0}
.panel{position:fixed;background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#title{top:16px;left:16px;padding:12px 16px}
#title h1{margin:0;font-size:17px;letter-spacing:.08em;font-weight:600}
#title h1 b{color:var(--cy);text-shadow:0 0 10px var(--cy)}
#title .sub{font-size:11.5px;opacity:.7;margin-top:4px;font-variant-numeric:tabular-nums}
#nav{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px}
#nav button{background:transparent;border:1px solid transparent;color:#dfe3ea;padding:7px 10px;border-radius:9px;white-space:nowrap;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
#nav button:hover{border-color:var(--line);background:rgba(255,255,255,.06)}
#nav button.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 12px rgba(79,243,255,.25) inset}
#team{top:16px;right:16px;width:280px;max-height:calc(100vh - 32px);overflow:auto;padding:10px 12px;font-size:12.5px}
#team h2{font-size:12px;margin:0 0 6px;letter-spacing:.15em;opacity:.7;font-weight:500}
.row{display:flex;align-items:center;gap:8px;padding:4px 2px;border-top:1px solid rgba(255,255,255,.06);cursor:pointer}
.row:hover{background:rgba(255,255,255,.05)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.row .n{width:52px;font-weight:600}.row .s{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#info{left:16px;top:96px;width:280px;padding:14px 16px;display:none}
#info h3{margin:0 0 2px;font-size:18px}#info .role{font-size:12px;opacity:.7;margin-bottom:10px}
#info .kv{font-size:12.5px;line-height:1.7}#info .kv span{opacity:.6;display:inline-block;width:46px}
#info .x{position:absolute;right:10px;top:8px;cursor:pointer;opacity:.6}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(8,10,18,.6);border:1px solid currentColor;text-shadow:0 0 6px currentColor;white-space:nowrap;pointer-events:auto;cursor:pointer;transform:translateY(-4px)}
.bub{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;color:#eef;background:rgba(20,22,34,.72);border:1px solid rgba(255,255,255,.18);padding:3px 8px;border-radius:8px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px)}
#src{position:fixed;bottom:18px;right:16px;font-size:11px;opacity:.55}
@media(max-width:760px){#team{display:none}#nav{flex-wrap:wrap;width:94vw;justify-content:center}}

#routines{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
#routines h2{font-size:11px;margin:0 0 6px;letter-spacing:.12em;opacity:.65;font-weight:500}
.rt{font-size:11px;padding:3px 0;border-top:1px solid rgba(255,255,255,.05);line-height:1.35}
.rt .bn{font-weight:600;margin-right:4px}
.rt .st{opacity:.55}
.badge{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid currentColor;margin-left:4px;white-space:nowrap}
.b-working{color:#39ff7a}.b-idle{color:#ffd23a}.b-waiting{color:#ff9f43}
@media(max-width:760px){#routines{display:none}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app"></div>
<div id="title" class="panel"><h1>STONE · <b>夜城</b> AI 辦公室</h1><div class="sub" id="clock">台北時間 --:--</div></div>
<div id="team" class="panel"><h2>團隊狀態 TEAM</h2><div id="rows"></div><div id="routines"><h2>ROUTINES 排程</h2><div id="rtrows"></div></div></div>
<div id="info" class="panel"><span class="x" id="ix">✕</span><h3 id="in"></h3><div class="role" id="ir"></div><div class="kv" id="ik"></div></div>
<div id="nav" class="panel"></div>
<div id="src">資料來源：<span id="srcv">模擬</span></div>
<script type="module" src="./main.js"></script>
</body>
</html>
